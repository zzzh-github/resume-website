<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赵政赫 · 主持版</title>
    <meta http-equiv="refresh" content="0; url=./?mode=host">
    <script>
        // 取当前文件所在目录，跳到主页并带上 ?mode=host
        (function () {
            var base = location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
            location.replace(base + '?mode=host');
        })();
    </script>
</head>
